<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="BitEat — sistem POS dhe menaxhimi për restorante" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>BitEat</title>

    <!--
      Apply the stored theme BEFORE anything paints, otherwise a dark-mode user
      gets a white flash on every load. Must stay inline and stay above the
      Tailwind script. Keep the storage key in sync with src/theme/ThemeProvider.js.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('biteat-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : null;
          var dark =
            mode === 'dark' ||
            (mode === null &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* private mode / storage disabled — fall back to light */
        }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Semantic colours resolve to CSS variables defined in src/index.css, so
      // light/dark is a variable swap rather than a `dark:` variant on every element.
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              canvas: 'rgb(var(--c-canvas) / <alpha-value>)',
              surface: 'rgb(var(--c-surface) / <alpha-value>)',
              subtle: 'rgb(var(--c-subtle) / <alpha-value>)',
              muted: 'rgb(var(--c-muted) / <alpha-value>)',
              line: 'rgb(var(--c-line) / <alpha-value>)',
              ink: 'rgb(var(--c-ink) / <alpha-value>)',
              'ink-muted': 'rgb(var(--c-ink-muted) / <alpha-value>)',
              'ink-subtle': 'rgb(var(--c-ink-subtle) / <alpha-value>)',
            },
            borderColor: {
              // bare `border`, `border-b`, `border-t` pick this up instead of
              // Tailwind's hard-coded gray-200, which is invisible on dark.
              DEFAULT: 'rgb(var(--c-line) / <alpha-value>)',
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <noscript>Ju duhet të aktivizoni JavaScript për të përdorur këtë aplikacion.</noscript>
    <div id="root"></div>
  </body>
</html>
