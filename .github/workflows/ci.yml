name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api-tests:
    name: API tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # The suite has no third-party dependencies: it runs on Node's built-in
      # test runner against a hand-written `pg` double, so there is nothing to
      # install and nothing to reach the network for.
      - name: Run API tests
        run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      # `npm ci` installs exactly what f/package-lock.json says. A bare
      # `npm install` re-resolves react-scripts' optional `typescript` peer
      # and, depending on the npm version, can pick a major that breaks
      # @typescript-eslint (and with it the whole ESLint step of the build).
      - name: Install frontend dependencies
        run: npm ci --prefix f

      - name: Build
        run: npm run build --prefix f
        env:
          CI: false # CRA treats warnings as errors when CI is set
